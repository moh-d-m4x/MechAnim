<!DOCTYPE html>
<html>
<head>
    <title>TAPIR Interactive Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { 
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .video-container {
            position: relative;
            display: inline-block;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
            cursor: crosshair;
        }
        video {
            display: block;
            max-height: 70vh;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #38bdf8;
            backdrop-filter: blur(4px);
        }
        .spinner {
            border: 4px solid #1e293b;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .controls {
            margin-top: 20px;
            background: #1e293b;
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .point-info {
            font-family: monospace;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <h1>🎯 TAPIR Interactive Demo</h1>
    <div class="subtitle">Click anywhere on the video to track a point!</div>
    
    <div class="video-container" id="videoContainer">
        <video id="videoPlayer" controls autoplay loop>
            <source src="/video" type="video/mp4">
        </video>
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <div>Running TAPIR Inference...</div>
        </div>
    </div>
    
    <div class="controls">
        <div class="point-info" id="pointInfo">Ready to track</div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const container = document.getElementById('videoContainer');
        const loading = document.getElementById('loading');
        const info = document.getElementById('pointInfo');
        
        container.addEventListener('click', async (e) => {
            if (loading.style.display === 'flex') return;
            
            // Get click coordinates relative to video
            const rect = video.getBoundingClientRect();
            
            // Check if click is outside video (e.g. controls)
            if (e.clientY > rect.bottom - 40) return; // Ignore control bar area approx
            
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            
            if (x < 0 || x > 1 || y < 0 || y > 1) return;
            
            console.log(`Click: ${x.toFixed(3)}, ${y.toFixed(3)}`);
            info.textContent = `Tracking point at (${x.toFixed(3)}, ${y.toFixed(3)})...`;
            
            // Show loading
            loading.style.display = 'flex';
            video.pause();
            
            try {
                // Determine source type (initial video or processed result)
                let isProcessed = video.currentSrc.includes("/video");
                
                const response = await fetch('/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x, y })
                });
                
                const data = await response.json();
                
                if (data.status === 'ok') {
                    // Force reload video with new timestamp
                    const timestamp = new Date().getTime();
                    video.src = `/video?t=${timestamp}`;
                    video.load();
                    video.play();
                    info.textContent = `Tracking complete! video reloaded.`;
                } else {
                    info.textContent = `Error: ${data.error}`;
                }
            } catch (err) {
                console.error(err);
                info.textContent = "Error connecting to server";
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
